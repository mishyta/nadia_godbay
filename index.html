<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лови суші!</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #gameCanvas { display: block; }
        #scoreBoard { 
            position: absolute; top: 20px; left: 20px; font-size: 32px; 
            color: white; font-family: sans-serif; text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

<div id="scoreBoard">Суші: 0</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('scoreBoard');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    const player = { x: canvas.width / 2 - 50, y: canvas.height - 200, w: 100, h: 100, speed: 100 };
    const sushiList = [];
    const sushiW = 125 / 2; // зменшено в 2 рази
    const sushiH = 100 / 2;

    const bgImg = new Image(); bgImg.src = 'bg.jpg';
    const playerImg = new Image(); playerImg.src = 'sticker.webp';
    const sushiImg = new Image(); sushiImg.src = 'sushu.png';

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (bgImg.complete) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        if (playerImg.complete) ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

        sushiList.forEach((s, index) => {
            if (sushiImg.complete) ctx.drawImage(sushiImg, s.x, s.y, sushiW, sushiH);
            s.y += s.speed;

            if (s.y + sushiH > player.y && s.x + sushiW > player.x && s.x < player.x + player.w) {
                sushiList.splice(index, 1);
                score++;
                scoreBoard.innerText = 'Суші: ' + score;
            }
            if (s.y > canvas.height) sushiList.splice(index, 1);
        });
        requestAnimationFrame(draw);
    }

    // Керування клавішами
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && player.x > 0) player.x -= player.speed;
        if (e.key === 'ArrowRight' && player.x < canvas.width - player.w) player.x += player.speed;
    });

    // Керування дотиком (сенсор)
    window.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX < canvas.width / 2) {
            // Ліва частина екрана - вліво
            if (player.x > 0) player.x -= player.speed;
        } else {
            // Права частина екрана - вправо
            if (player.x < canvas.width - player.w) player.x += player.speed;
        }
    });

    setInterval(() => {
        sushiList.push({ x: Math.random() * (canvas.width - sushiW), y: -sushiH, speed: 5 + Math.random() * 4 });
    }, 800);

    draw();
</script>
</body>
</html>
